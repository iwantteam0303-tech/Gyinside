<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디스코드 웹훅 전송기</title>
    <style>
        :root {
            --bg-color: #2b2d31;
            --container-bg: #313338;
            --text-color: #dbdee1;
            --input-bg: #1e1f22;
            --border-color: #1e1f22;
            --accent-color: #5865F2;
            --accent-hover: #4752C4;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--container-bg);
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #fff;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        input[type="text"], input[type="url"], textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .checkbox-group input {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .embed-section {
            display: none;
            background-color: rgba(0, 0, 0, 0.1);
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
            margin-bottom: 16px;
        }

        .file-upload {
            background-color: var(--input-bg);
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed #555;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>디스코드 웹훅 전송기</h2>

    <div class="form-group">
        <label for="content">메시지 내용 (선택)</label>
        <textarea id="content" placeholder="전송할 텍스트를 입력하세요."></textarea>
    </div>

    <label class="checkbox-group">
        <input type="checkbox" id="useEmbed" onchange="toggleEmbedSection()">
        <strong>임베드(Embed) 추가하기</strong>
    </label>

    <div class="embed-section" id="embedSection">
        <div class="form-group">
            <label for="embedTitle">임베드 제목</label>
            <input type="text" id="embedTitle" placeholder="제목을 입력하세요">
        </div>
        <div class="form-group">
            <label for="embedDesc">임베드 설명</label>
            <textarea id="embedDesc" placeholder="설명을 입력하세요"></textarea>
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label for="embedColor">임베드 색상</label>
                <input type="color" id="embedColor" value="#5865F2" style="width: 100%; height: 38px; padding: 2px; cursor: pointer;">
            </div>
            <div class="form-group">
                <label for="embedImageUrl">이미지 URL (선택)</label>
                <input type="url" id="embedImageUrl" placeholder="https://...">
            </div>
        </div>
    </div>

    <div class="form-group">
        <label>파일 첨부 (선택)</label>
        <input type="file" id="fileUpload" class="file-upload">
    </div>

    <button onclick="sendWebhook()">전송하기</button>
</div>

<script>
    // 👇👇 여기에 사용할 디스코드 웹훅 URL을 넣어주세요! 👇👇
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1553741493154611274/w3rrA09xUDUC6qk-NrucsG1NaRRkDIW-XINZe6Y5nHI0QwllkiAxPAw3udyXaIdKeogb";
    // 👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆

    function toggleEmbedSection() {
        const useEmbed = document.getElementById('useEmbed').checked;
        document.getElementById('embedSection').style.display = useEmbed ? 'block' : 'none';
    }

    async function sendWebhook() {
        if (WEBHOOK_URL === "여기에_웹훅_URL_입력" || !WEBHOOK_URL) {
            alert('코드 내부에 웹훅 URL이 설정되지 않았습니다.\nHTML 파일의 WEBHOOK_URL 변수를 수정해주세요.');
            return;
        }

        // 기본 데이터 구성
        const payload = {};
        
        const content = document.getElementById('content').value.trim();
        if (content) payload.content = content;

        // 임베드 구성
        if (document.getElementById('useEmbed').checked) {
            const title = document.getElementById('embedTitle').value.trim();
            const description = document.getElementById('embedDesc').value.trim();
            const colorHex = document.getElementById('embedColor').value;
            const imageUrl = document.getElementById('embedImageUrl').value.trim();
            
            const colorDec = parseInt(colorHex.replace('#', ''), 16);

            const embed = {};
            if (title) embed.title = title;
            if (description) embed.description = description;
            if (colorHex) embed.color = colorDec;
            if (imageUrl) embed.image = { url: imageUrl };

            if (Object.keys(embed).length > 0) {
                payload.embeds = [embed];
            }
        }

        // FormData 구성
        const formData = new FormData();
        formData.append('payload_json', JSON.stringify(payload));

        // 파일 추가
        const fileInput = document.getElementById('fileUpload');
        if (fileInput.files.length > 0) {
            formData.append('files[0]', fileInput.files[0]);
        } else {
            if (Object.keys(payload).length === 0) {
                alert('전송할 내용(메시지, 임베드, 파일 중 하나)을 입력해주세요.');
                return;
            }
        }

        try {
            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                alert('웹훅 전송에 성공했습니다!');
                // 옵션: 성공 시 폼 비우기
                // document.getElementById('content').value = '';
                // document.getElementById('embedTitle').value = '';
                // document.getElementById('embedDesc').value = '';
                // document.getElementById('fileUpload').value = '';
            } else {
                const errorData = await response.text();
                alert(`전송 실패 (HTTP ${response.status})\n${errorData}`);
            }
        } catch (error) {
            alert('요청 중 오류가 발생했습니다: ' + error.message);
        }
    }
</script>

</body>
</html>
